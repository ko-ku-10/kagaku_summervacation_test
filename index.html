<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学式・イオン式 超速暗記</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #app {
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .status {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .card {
        background: #fff;
        border-radius: 12px;
        padding: 40px 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 20px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .question {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .answer {
        font-size: 32px;
        color: #e74c3c;
        font-weight: bold;
        display: none; /* 初期状態は非表示 */
        margin-top: 20px;
    }
    button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 10px;
        transition: background 0.2s;
    }
    .btn-show { background: #3498db; color: #fff; }
    .btn-show:active { background: #2980b9; }
    
    .judge-buttons {
        display: none; /* 答えを見るまでは非表示 */
        justify-content: space-between;
        gap: 10px;
    }
    .btn-correct { background: #2ecc71; color: #fff; width: 48%; }
    .btn-wrong { background: #e74c3c; color: #fff; width: 48%; }
    
    .completed {
        font-size: 24px;
        color: #2ecc71;
        font-weight: bold;
        display: none;
    }
</style>
</head>
<body>

<div id="app">
    <div class="status">残り: <span id="count">0</span> 問</div>
    
    <div class="card" id="flashcard">
        <div class="question" id="question-text">ロード中...</div>
        <div class="answer" id="answer-text"></div>
    </div>

    <button class="btn-show" id="btn-show" onclick="showAnswer()">答えを見る</button>
    
    <div class="judge-buttons" id="judge-buttons">
        <button class="btn-wrong" onclick="judge(false)">❌ わからなかった</button>
        <button class="btn-correct" onclick="judge(true)">⭕ 完璧！</button>
    </div>

    <div class="completed" id="completed-message">
        🎉 全問クリア！<br><br>
        <button class="btn-show" onclick="location.reload()">もう1周する</button>
    </div>
</div>

<script>

// ここまで

let deck = [...allCards]; // 現在のデッキ（シャッフルして使う）
let currentCardIndex = 0;

// 配列をシャッフルする関数
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function init() {
    deck = shuffle(deck);
    showNextCard();
}

function showNextCard() {
    if (deck.length === 0) {
        document.getElementById('flashcard').style.display = 'none';
        document.getElementById('btn-show').style.display = 'none';
        document.getElementById('judge-buttons').style.display = 'none';
        document.getElementById('completed-message').style.display = 'block';
        document.getElementById('count').innerText = "0";
        return;
    }
    
    document.getElementById('count').innerText = deck.length;
    document.getElementById('question-text').innerHTML = deck[0].q;
    document.getElementById('answer-text').innerHTML = deck[0].a;
    
    // 表示状態のリセット
    document.getElementById('answer-text').style.display = 'none';
    document.getElementById('btn-show').style.display = 'block';
    document.getElementById('judge-buttons').style.display = 'none';
}

function showAnswer() {
    document.getElementById('answer-text').style.display = 'block';
    document.getElementById('btn-show').style.display = 'none';
    document.getElementById('judge-buttons').style.display = 'flex';
}

function judge(isCorrect) {
    const card = deck.shift(); // 先頭のカードを取り出す
    
    if (!isCorrect) {
        // 間違えた場合はデッキの最後に追加して再度出題する
        deck.push(card);
    }
    
    showNextCard();
}

// 起動
init();
</script>
</body>
</html>
